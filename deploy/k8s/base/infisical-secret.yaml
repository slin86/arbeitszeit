# Syncs the secrets from Infisical (folder /arbeitszeit) into the Secret `arbeitszeit-secrets`, which
# the app reads as environment variables. Same setup as Kontor; the values never go into git.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: arbeitszeit-secrets
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        projectSlug: homelab-ei-fj
        envSlug: prod
        secretsPath: /arbeitszeit
  managedSecretReference:
    secretName: arbeitszeit-secrets
    secretNamespace: arbeitszeit
    creationPolicy: Owner
