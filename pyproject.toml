[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbeitszeit"
version = "0.1.0"
description = "Arbeitszeiterfassung mit Projekten, monatlicher Freigabe, lokalen Benutzern und OIDC-Login"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "pydantic-settings>=2.4",
    "holidays>=0.55",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
arbeitszeit = "arbeitszeit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbeitszeit = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
